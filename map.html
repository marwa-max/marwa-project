<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte Tunisie Telecom</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.main-card {
    background: white;
    width: 95%;
    max-width: 1000px;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    padding: 20px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.header img { height: 55px; }

.title {
    font-size: 22px;
    font-weight: bold;
    color: #2c3e50;
    text-align: center;
}

/* LANGUAGE SWITCH */
.lang-switch {
    text-align: center;
    margin-bottom: 15px;
}

.lang-switch button {
    padding: 6px 14px;
    margin: 0 5px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background: #3498db;
    color: white;
    font-size: 14px;
}

/* DESCRIPTION */
.description {
    text-align: center;
    font-size: 18px;
    color: #2c3e50;
    font-weight: bold;
    margin-bottom: 15px;
}

/* MAP */
.map-box iframe {
    width: 100%;
    height: 500px;
    border: none;
    border-radius: 15px;
}

/* BUTTONS */
.buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}

.buttons a button {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    color: white;
}

.btn-back {
    background: #7f8c8d;
}

.btn-next {
    background: #e74c3c;
}
</style>
</head>

<body>

<div class="main-card">

    <!-- HEADER -->
    <div class="header">
        <img src="images.jpg">
        <div class="title" id="titleText">📍 Carte des agences</div>
        <img src="LOGO_TT_.jpg">
    </div>

    <!-- LANGUAGE SWITCH -->
    <div class="lang-switch">
        <button onclick="setLang('fr')">FR</button>
        <button onclick="setLang('ar')">AR</button>
        <button onclick="setLang('en')">EN</button>
    </div>

    <!-- DESCRIPTION -->
    <div class="description" id="descText">
        Cliquez pour connaître l’agence la plus proche de chez vous
    </div>

    <!-- MAP -->
    <div class="map-box">
        <iframe id="mapFrame" src="https://geo.tunisietelecom.tn/ett/"></iframe>
    </div>

    <!-- BUTTONS -->
    <div class="buttons">
        <a href="index.html">
            <button class="btn-back" id="backBtn">← Retour</button>
        </a>
        <a href="page2.html">
            <button class="btn-next" id="nextBtn">Suivant →</button>
        </a>
    </div>

</div>

<script>
const texts = {
    fr: {
        title: "📍 Carte des agences",
        desc: "Cliquez pour connaître l’agence la plus proche de chez vous",
        back: "← Retour",
        next: "Suivant →"
    },
    ar: {
        title: "📍 خريطة الوكالات",
        desc: "اضغط لتعرف أقرب مقرّ إليك",
        back: "← عودة",
        next: "التالي →"
    },
    en: {
        title: "📍 Agencies map",
        desc: "Click to find the nearest agency to you",
        back: "← Back",
        next: "Next →"
    }
};

function setLang(lang) {
    document.getElementById("titleText").innerHTML = texts[lang].title;
    document.getElementById("descText").innerHTML = texts[lang].desc;
    document.getElementById("backBtn").innerHTML = texts[lang].back;
    document.getElementById("nextBtn").innerHTML = texts[lang].next;
}

// لغة افتراضية
setLang("fr");
</script>

</body>
</html>
