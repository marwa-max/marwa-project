<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon projet</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        url("fibre.jpg") left center no-repeat, /* الصورة على اليسار */
        url("box1.jpg") right center no-repeat, /* الصورة على اليمين */
        linear-gradient(135deg, #74ebd5, #ACB6E5);

    background-size: 170px 75%, 170px 75%, cover;
}

.main-card {
    background:white; width:95%; max-width:1000px;
    border-radius:25px; padding:20px; box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

.header {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;
}
.header img { height:55px; }
.title { font-size:22px; font-weight:bold; text-align:center; color:#2c3e50; }

.lang-switch { text-align:center; margin-bottom:10px; }
.lang-switch button {
    padding:6px 14px; margin:0 5px; border:none; border-radius:15px;
    background:#3498db; color:white; cursor:pointer;
}

/* SLIDER */
.extra-images { position:relative; width:100%; height:260px; margin:15px 0; overflow:hidden; border-radius:20px; background:#f0f0f0; }
.slider-track { display:flex; width:100%; height:100%; transition: transform 0.8s ease; }
.slide { min-width:100%; height:100%; text-align:center; }
.slide img { width:100%; height:85%; object-fit:contain; }
.slide-text { font-weight:bold; font-size:18px; color:#2c3e50; }
.slider-btn { position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(0,0,0,0.55); color:white; border:none; font-size:28px; padding:10px 16px; cursor:pointer; border-radius:50%; z-index:5;}
.slider-btn.prev { left:10px; }
.slider-btn.next { right:10px; }

/* MAP */
.map-box iframe { width:100%; height:380px; border:none; border-radius:15px; }

.map-button-container { text-align:center; margin:20px 0; }
.map-button-container button { padding:14px 30px; font-size:17px; border:none; border-radius:30px; background:#e74c3c; color:white; cursor:pointer; }
    /* BUTTON NAVIGATION */
.nav-buttons { width:100%; max-width:1000px; display:flex; justify-content:space-between; margin-bottom:10px; }
.nav-buttons a button {
    padding:10px 20px; font-size:16px; border:none; border-radius:15px;
    background:#2ecc71; color:white; cursor:pointer;
    transition:0.3s;
}
.nav-buttons a button:hover { background:#27ae60; }

/* INFO TOOLTIP */
.info-container { position:relative; text-align:center; margin-top:15px; }
.info-text { font-weight:bold; color:#3498db; cursor:pointer; text-decoration:underline; }
.info-tooltip {
    visibility:hidden; opacity:0; position:absolute; bottom:130%; left:50%;
    transform:translateX(-50%); width:320px; background:#2c3e50; color:white;
    padding:15px; border-radius:12px; font-size:14px; transition:0.3s;
    box-shadow:0 10px 25px rgba(0,0,0,0.3); z-index:10;
}
.info-container:hover .info-tooltip { visibility:visible; opacity:1; }
</style>
</head>
<body>

<div class="main-card">

    <div class="header">
        <img src="images.jpg">
        <div class="title" id="titleText">📍 Mon projet</div>
        <img src="LOGO_TT_.jpg">
    </div>

    <div class="lang-switch">
        <button onclick="setLang('fr')">FR</button>
        <button onclick="setLang('ar')">AR</button>
        <button onclick="setLang('en')">EN</button>
    </div>

    <!-- SLIDER -->
    <div class="extra-images" onmouseenter="pauseSlider()" onmouseleave="resumeSlider()">
        <div class="slider-track" id="sliderTrack">
            <div class="slide">
                <img id="img1" src="e1.png">
                <div class="slide-text" id="txt1">Étape 1</div>
            </div>
            <div class="slide">
                <img id="img2" src="t2.png">
                <div class="slide-text" id="txt2">Étape 2</div>
            </div>
        </div>
        <button class="slider-btn prev" onclick="prevSlide()">◀</button>
        <button class="slider-btn next" onclick="nextSlide()">▶</button>
    </div>

    <!-- MAP -->
    <div class="map-box">
        <iframe src="https://geo.tunisietelecom.tn/mytaghtia/"></iframe>
    </div>

    <div class="map-button-container">
        <a href="map.html"><button id="mapBtn">🏢 Trouver un espace TT</button></a>
    </div>

    <!-- INFO -->
    <div class="info-container">
        <span class="info-text">ℹ️ info</span>
        <div class="info-tooltip" id="infoText">Cliquez ici pour plus d'informations.</div>
    </div>
    <!-- NAVIGATION BUTTONS -->
<div class="nav-buttons">
    <a href="index.html"><button>← Retour</button></a>
</div>

</div>

<script>
// SLIDER
let currentSlide = 0;
const sliderTrack = document.getElementById("sliderTrack");
const totalSlides = 2;
let interval = setInterval(nextSlide,4000);

function updateSlider(){ sliderTrack.style.transform=`translateX(-${currentSlide*100}%)`; }
function nextSlide(){ currentSlide=(currentSlide+1)%totalSlides; updateSlider(); }
function prevSlide(){ currentSlide=(currentSlide-1+totalSlides)%totalSlides; updateSlider(); }
function pauseSlider(){ clearInterval(interval); }
function resumeSlider(){ interval=setInterval(nextSlide,4000); }

// TEXT + IMAGES لكل لغة
const texts = {
    fr: { title:"📍 Mon projet", mapBtn:"🏢 Trouver un espace TT", etape1:"Étape 1 : Vérifier la couverture", etape2:"Étape 2 : Choisir l’offre", img1:"e1.png", img2:"t2.png", info:"<b>Introduction du rapport</b><br>Dans le cadre de mon stage de perfectionnement effectué au sein de Tunisie Télécom, ce projet a été réalisé afin de renforcer mes compétences en développement web." },
    ar: { title:"📍 مشروعي", mapBtn:"🏢 إيجاد فضاء اتصالات تونس", etape1:"المرحلة 1: التحقق من التغطية", etape2:"المرحلة 2: اختيار العرض", img1:"e2.png", img2:"t1.png", info:"<b>مقدمة التقرير</b><br>في إطار التدريب التطبيقي الذي قمت به في شركة اتصالات تونس، تم إنجاز هذا المشروع من أجل تطوير مهاراتي في تطوير الويب." },
    en: { title:"📍 My project", mapBtn:"🏢 Find a TT space", etape1:"Step 1: Check coverage", etape2:"Step 2: Choose the offer", img1:"e3.png", img2:"t3.png", info:"<b>Report introduction</b><br>As part of my internship at Tunisie Telecom, this project was carried out to improve my web development skills." }
};

function setLang(lang){
    document.getElementById("titleText").innerHTML=texts[lang].title;
    document.getElementById("mapBtn").innerHTML=texts[lang].mapBtn;
    document.getElementById("infoText").innerHTML=texts[lang].info;
    document.getElementById("img1").src=texts[lang].img1;
    document.getElementById("img2").src=texts[lang].img2;
    document.getElementById("txt1").innerHTML=texts[lang].etape1;
    document.getElementById("txt2").innerHTML=texts[lang].etape2;
    // تبديل نص الزر حسب اللغة
    const retour = { fr:"← Retour", ar:"عودة ←", en:"← Back" };
    document.getElementById("btnRetour").innerHTML = retour[lang];
    currentSlide=0; updateSlider();
}

// خلي الصفحة بدون لغة افتراضية
</script>
</body>
</html>
